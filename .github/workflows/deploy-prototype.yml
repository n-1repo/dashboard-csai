name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "prototype/**"
      - ".github/workflows/deploy-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - working-directory: prototype
        run: npm ci

      - working-directory: prototype
        run: npm run build
        env:
          NEXT_BASE_PATH: /dashboard-csai

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
